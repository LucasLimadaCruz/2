<!DOCTYPE html> <!--Lucas Lima da Cruz RA:26110686-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaporwave Sum Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <main class="calculator-card">
    <header class="calculator-header">
      <h1 class="glitch-title">ＳＵＭ．ＥＸＥ</h1>
      <p class="subtitle">ＡＥＳＴＨＥＴＩＣ  ＣＡＬＣＵＬＡＴＯＲ</p>
    </header>

    <form id="calc-form" class="calculator-form" onsubmit="return false;">
      <div class="input-group">
        <label for="num1">NUMBER _01</label>
        <input type="number" id="num1" name="num1" step="any" placeholder="00.00" required autocomplete="off">
      </div>

      <div class="operator">+</div>

      <div class="input-group">
        <label for="num2">NUMBER _02</label>
        <input type="number" id="num2" name="num2" step="any" placeholder="00.00" required autocomplete="off">
      </div>

      <button type="submit" id="submit-btn" class="vapor-button">
        [ CALCULATE ]
      </button>
    </form>

    <div class="result-container">
      <span class="result-label">RESULT:</span>
      <div id="result-display" class="result-display">0.00</div>
    </div>
    <script src="main.js"></script>
  </main>

</body>
</html>
